services:
  open-webui:
    image: ${OPENWEBUI_IMAGE:-ghcr.io/open-webui/open-webui@sha256:6bb1fbe8ab0a3e0456067f493044ffb66a30a65a34be47f6a5862176a370dd16}
    container_name: ${OPENWEBUI_CONTAINER_NAME:-open-webui-lab}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENWEBUI_PORT:-3001}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ENABLE_OPENAI_API: ${ENABLE_OPENAI_API:-true}
      OPENAI_API_BASE_URLS: ${OPENAI_API_BASE_URLS:-https://openrouter.ai/api/v1}
      OPENAI_API_KEYS: ${OPENAI_API_KEYS:-}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY must be set in .env.local or the environment}
    depends_on:
      open-terminal:
        condition: service_healthy
    volumes:
      - ${OPENWEBUI_VOLUME_NAME:-open-webui-data}:/app/backend/data

  open-terminal:
    image: ${OPEN_TERMINAL_IMAGE:-ghcr.io/open-webui/open-terminal@sha256:5f48c86bb249dbbd9c18fca92cd4188a53787c50ac6ad0d8412b2b18f7071c61}
    container_name: ${OPEN_TERMINAL_CONTAINER_NAME:-open-terminal-lab}
    restart: unless-stopped
    environment:
      OPEN_TERMINAL_API_KEY: ${OPEN_TERMINAL_API_KEY:?OPEN_TERMINAL_API_KEY must be set in .env.local or the environment}
      OPEN_TERMINAL_FILE_BROWSER_ROOT: /home/user
    volumes:
      - open-terminal-data:/home/user
      - ${CODEX_RUNBOOKS_DIR:-/Users/rajeev/.codex/docs}:/home/user/codex-runbooks:ro
      - ./docs:/home/user/local-llm-lab-runbooks:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

volumes:
  open-webui-data:
    name: ${OPENWEBUI_VOLUME_NAME:-open-webui-data}
  open-terminal-data:
    name: ${OPEN_TERMINAL_VOLUME_NAME:-open-terminal-data}
